<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴 · 心理健康综合平台</title>
    <style>
        /* ================= 全局与变量 ================= */
        :root {
            --primary: #7a5ba6;
            --primary-light: #cdb8f0;
            --primary-bg: #f3ebff;
            --text-main: #4d3b6e;
            --text-sub: #7a6898;
            --bg-glass: rgba(255, 255, 255, 0.65);
            --border-glass: rgba(255, 255, 255, 0.8);
            --shadow-soft: 0 10px 32px -8px rgba(124, 105, 166, 0.2);
            --shadow-hover: 0 20px 40px -10px rgba(124, 105, 166, 0.3);
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #f7f0ff;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(203, 185, 240, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 199, 222, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(182, 158, 224, 0.2) 0%, transparent 50%);
            background-attachment: fixed;
            font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            display: flex;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(182, 158, 224, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(182, 158, 224, 0.6); }

        /* ================= 左侧边栏导航 ================= */
        .sidebar {
            width: 240px; height: 100vh; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.8); padding: 30px 20px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 4px 0 24px rgba(140, 110, 190, 0.08); z-index: 10; flex-shrink: 0;
        }

        .sidebar-logo {
            font-size: 1.5rem; font-weight: 700; color: #4d3b6e; text-align: center;
            margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; letter-spacing: 1px;
        }
        .sidebar-logo span { font-size: 2.2rem; }

        .nav-btn {
            background: transparent; border: none; padding: 14px 20px; border-radius: 16px;
            font-size: 1rem; font-weight: 500; color: #5a4a72; cursor: pointer; text-align: left;
            transition: all 0.25s ease; display: flex; align-items: center; gap: 12px;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.6); color: #3e2f58; transform: translateX(4px); }
        .nav-btn.active { background: #ffffff; color: #4d3b6e; box-shadow: 0 4px 12px rgba(142, 113, 191, 0.15); font-weight: 600; }

        /* ================= 主内容区 ================= */
        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 30px; display: flex; justify-content: center; align-items: flex-start; }
        .page-section { display: none; width: 100%; max-width: 800px; animation: fadeIn 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--bg-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-soft), inset 0 0 0 1px var(--border-glass);
            transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover), inset 0 0 0 1px var(--border-glass); }

        .card-title {
            font-size: 1.3rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px dashed rgba(203, 185, 240, 0.5);
        }
        .card-title .icon { font-size: 1.5rem; }

        /* ================= 模块1：虚拟智能体 ================= */
        .agent-card { align-items: center; justify-content: space-between; background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.4) 100%); }
        .agent-name { font-size: 2rem; font-weight: 800; color: #4d3b6e; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; letter-spacing: 2px; }
        .avatar-container { position: relative; width: 100%; height: 320px; display: flex; justify-content: center; align-items: flex-end; filter: drop-shadow(0 15px 25px rgba(130, 100, 180, 0.2)); }
        .breathing-avatar { animation: breathe 4s ease-in-out infinite; transform-origin: center 95%; }
        @keyframes breathe { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .avatar-svg { width: 280px; height: 320px; display: block; }
        .blink-group { animation: blink 4s infinite; transform-origin: center 125px; }
        @keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46%, 47% { transform: scaleY(0.1); } }

        .status-box { margin: 16px 0 24px; background: rgba(255, 255, 255, 0.9); padding: 14px 32px; border-radius: 50px; box-shadow: 0 4px 12px rgba(149, 118, 194, 0.1); text-align: center; width: 100%; border: 1px solid rgba(255,255,255,0.8); transition: all 0.3s ease; }
        .status-text { font-size: 1.2rem; font-weight: 600; color: var(--primary); }

        .button-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; width: 100%; }
        .action-btn {
            background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(203, 185, 240, 0.4); border-radius: 50px;
            padding: 12px 28px; font-size: 1.05rem; font-weight: 600; color: var(--text-main); cursor: pointer;
            box-shadow: 0 2px 8px rgba(142, 113, 191, 0.05); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:hover { background: #fff; border-color: var(--primary-light); transform: translateY(-2px); }
        .action-btn.active { background: var(--primary-light); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(168, 142, 214, 0.4); transform: translateY(-2px); }

        /* ================= 模块2：自助小工具 ================= */
        .tools-container { display: flex; flex-direction: column; gap: 24px; }
        .breath-area { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .circle-wrapper { position: relative; width: 140px; height: 140px; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
        .breath-circle {
            width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d8c8f5, #b69ee0);
            box-shadow: 0 0 30px rgba(182, 158, 224, 0.4); transition: transform 0.1s linear, background 0.4s ease; transform: scale(1); position: relative; z-index: 2;
        }
        .circle-wrapper::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%;
            border-radius: 50%; background: rgba(182, 158, 224, 0.15); animation: pulseGlow 3s infinite alternate; z-index: 1;
        }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; } }
        .breath-text-area { text-align: center; min-height: 50px; margin-bottom: 16px; }
        .breath-status { font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        .breath-hint { font-size: 0.85rem; color: var(--text-sub); }
        .breath-buttons { display: flex; gap: 12px; justify-content: center; width: 100%; }

        .mood-container { display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
        .mood-value-display { font-size: 3rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 12px; }
        .mood-slider { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 10px; background: linear-gradient(90deg, #e0d0ff, #a88ed6); outline: none; margin-bottom: 8px; }
        .mood-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid var(--primary); cursor: pointer; }
        .mood-labels { display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: var(--text-sub); margin-bottom: 16px; }
        .mood-message { font-size: 0.95rem; color: var(--text-main); text-align: center; min-height: 40px; line-height: 1.5; margin-bottom: 16px; padding: 10px; background: rgba(255, 255, 255, 0.5); border-radius: var(--radius-sm); width: 100%; display: flex; align-items: center; justify-content: center; }
        .mood-buttons { display: flex; gap: 12px; width: 100%; justify-content: center; }

        .record-textarea { width: 100%; min-height: 100px; border-radius: var(--radius-md); border: 1px solid rgba(203, 185, 240, 0.5); background: rgba(255, 255, 255, 0.6); padding: 14px; font-size: 0.95rem; font-family: inherit; color: var(--text-main); resize: vertical; outline: none; margin-bottom: 12px; }
        .record-textarea:focus { border-color: var(--primary-light); background: #fff; }
        .record-actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; }
        .record-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
        .record-item { background: rgba(255, 255, 255, 0.7); border-radius: var(--radius-md); padding: 12px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .record-item-text { flex: 1; font-size: 0.95rem; color: var(--text-main); line-height: 1.5; word-break: break-word; }
        .record-item-date { font-size: 0.75rem; color: var(--text-sub); white-space: nowrap; }
        .delete-btn { background: none; border: none; color: #c4b5d9; font-size: 1.1rem; cursor: pointer; }
        .empty-records { text-align: center; color: var(--text-sub); font-size: 0.9rem; padding: 20px 0; font-style: italic; }

        .btn { border: none; border-radius: var(--radius-md); padding: 10px 20px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); background: #fff; box-shadow: 0 2px 8px rgba(142, 113, 191, 0.1); cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn.primary { background: var(--primary-light); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.danger { background: #fdf2f2; color: #c75c5c; border: 1px solid #f8d7d7; }

        /* ================= 模块3：人脸识别 ================= */
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #1a1a2e; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 16px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .cam-controls { display: flex; gap: 12px; align-items: center; justify-content: center; margin-bottom: 16px; }
        .cam-status { font-size: 0.9rem; color: var(--text-sub); background: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 20px; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .emotion-panel { display: flex; flex-direction: column; gap: 12px; }
        .emotion-main { display: flex; align-items: center; gap: 16px; background: rgba(255, 255, 255, 0.8); padding: 14px 20px; border-radius: var(--radius-md); }
        .emotion-emoji { font-size: 2.5rem; }
        .emotion-info { display: flex; flex-direction: column; }
        .emotion-label { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        .emotion-confidence { font-size: 0.85rem; color: var(--text-sub); }
        .emotion-bars { display: flex; flex-direction: column; gap: 8px; background: rgba(255, 255, 255, 0.6); padding: 16px; border-radius: var(--radius-md); }
        .bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--text-main); }
        .bar-name { width: 48px; text-align: right; font-weight: 600; }
        .bar-track { flex: 1; height: 6px; background: rgba(203, 185, 240, 0.3); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #b69ee0, #8a68c0); width: 0%; transition: width 0.2s ease; }
        .bar-percent { width: 36px; text-align: right; color: var(--text-sub); }

        /* ================= 模块4：心理支持对话 ================= */
        .chat-card { height: 650px; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed rgba(203, 185, 240, 0.5); }
        .chat-header .card-title { margin: 0; padding: 0; border: none; }
        .status-badge { font-size: 0.8rem; font-weight: 600; color: #4a7a4a; background: #eaffea; padding: 4px 12px; border-radius: 20px; border: 1px solid #c3e6c3; }
        
        .settings-area { padding: 12px 16px; background: rgba(245, 238, 255, 0.6); border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; margin-bottom: 16px; }
        .setting-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .setting-row label { color: var(--text-main); font-weight: 500; white-space: nowrap; }
        .setting-row input { flex: 1; min-width: 160px; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid rgba(203, 185, 240, 0.5); outline: none; font-size: 0.85rem; color: var(--text-main); }
        .mock-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-sub); font-size: 0.85rem; }

        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: rgba(255, 255, 255, 0.4); border-radius: var(--radius-md); margin-bottom: 16px; }
        .message { display: flex; gap: 12px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }
        .avatar-chat { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.2rem; }
        .message.user .avatar-chat { background: #a88ed6; }
        .bubble-chat { padding: 12px 18px; border-radius: 20px; font-size: 1rem; line-height: 1.6; background: #fff; color: var(--text-main); }
        .message.user .bubble-chat { background: #ede4ff; border-bottom-right-radius: 4px; }
        .message.bot .bubble-chat { border-bottom-left-radius: 4px; }

        .quick-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
        .quick-btn { padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(203, 185, 240, 0.5); background: rgba(255, 255, 255, 0.7); color: var(--text-main); font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        .quick-btn:hover { background: #fff; }

        .chat-input-area { display: flex; gap: 12px; align-items: flex-end; }
        .chat-input-area textarea { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid rgba(203, 185, 240, 0.6); background: #fff; resize: none; outline: none; min-height: 50px; max-height: 120px; font-size: 1rem; color: var(--text-main); font-family: inherit; }
        .send-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--primary-light); color: #fff; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(77, 59, 110, 0.9); color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 0.9rem; z-index: 9999; }
        
        @media (max-width: 800px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; gap: 8px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.8); }
            .sidebar-logo { display: none; }
            .nav-btn { padding: 10px 16px; white-space: nowrap; }
            .main-content { padding: 16px; height: auto; }
            .chat-card { height: 600px; }
        }
    </style>
</head>
<body>

    <!-- 侧边栏导航 -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <span>🌿</span>
            心晴 · 空间
        </div>
        <button class="nav-btn active" data-target="page-agent">🌸 虚拟智能体</button>
        <button class="nav-btn" data-target="page-tools">🫁 自助小工具</button>
        <button class="nav-btn" data-target="page-camera">📷 表情识别</button>
        <button class="nav-btn" data-target="page-chat">💬 心理支持对话</button>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        
        <!-- ================= 页面 1：虚拟智能体 ================= -->
        <div class="page-section active" id="page-agent">
            <div class="card agent-card">
                <div class="agent-name">
                    <span>🌸</span> 心晴 <span>🌸</span>
                </div>
                <div class="avatar-container">
                    <div class="breathing-avatar">
                        <svg class="avatar-svg" viewBox="0 0 260 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="skinGrad" cx="40%" cy="30%" r="70%">
                                    <stop offset="0%" stop-color="#FFF9F3" />
                                    <stop offset="60%" stop-color="#FFE9D8" />
                                    <stop offset="100%" stop-color="#F5D2BC" />
                                </radialGradient>
                                <linearGradient id="hairGrad" x1="30%" y1="0%" x2="70%" y2="100%">
                                    <stop offset="0%" stop-color="#9B7EC8" />
                                    <stop offset="50%" stop-color="#7A5BA6" />
                                    <stop offset="100%" stop-color="#553A7A" />
                                </linearGradient>
                                <linearGradient id="dressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#F6EEFF" />
                                    <stop offset="50%" stop-color="#DCC8F7" />
                                    <stop offset="100%" stop-color="#B99FE6" />
                                </linearGradient>
                                <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#FFAFC9" stop-opacity="0.7" />
                                    <stop offset="100%" stop-color="#FFAFC9" stop-opacity="0" />
                                </radialGradient>
                            </defs>

                            <ellipse cx="130" cy="288" rx="60" ry="8" fill="#B9A0E0" opacity="0.25" />

                            <!-- 腿部 -->
                            <path d="M105 240 Q103 262 104 280 L115 280 Q116 260 114 240 Z" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="1" />
                            <path d="M155 240 Q157 262 156 280 L145 280 Q144 260 146 240 Z" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="1" />
                            <ellipse cx="109" cy="282" rx="10" ry="6" fill="#B99FE6" stroke="#9B7EC8" stroke-width="1" />
                            <ellipse cx="151" cy="282" rx="10" ry="6" fill="#B99FE6" stroke="#9B7EC8" stroke-width="1" />

                            <!-- 裙子 -->
                            <path d="M100 198 Q88 230 85 255 Q115 268 130 268 Q145 268 175 255 Q172 230 160 198 Q145 208 130 208 Q115 208 100 198 Z" fill="url(#dressGrad)" stroke="#B99FE6" stroke-width="1.2" />
                            <path d="M105 215 Q102 238 98 258" stroke="#B99FE6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
                            <path d="M155 215 Q158 238 162 258" stroke="#B99FE6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4" />
                            <ellipse cx="130" cy="198" rx="26" ry="8" fill="#FDF8FF" stroke="#D6C2FF" stroke-width="1" />
                            <g transform="translate(130, 202)">
                                <path d="M0 0 Q-9 -5 -7.5 1.5 Q-6 5 0 3.5 Q-6 9 -4 13 Q-1 14 0 7 Z" fill="#F28DB9" />
                                <path d="M0 0 Q9 -5 7.5 1.5 Q6 5 0 3.5 Q6 9 4 13 Q1 14 0 7 Z" fill="#F28DB9" />
                                <circle cx="0" cy="3.5" r="2.5" fill="#FFC7DE" />
                            </g>

                            <!-- 手臂 -->
                            <path d="M95 205 Q80 220 82 240 Q83 245 88 243 Q92 225 98 212 Z" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="1" />
                            <ellipse cx="85" cy="244" rx="6" ry="5.5" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="0.8" />
                            <path d="M165 205 Q180 220 178 240 Q177 245 172 243 Q168 225 162 212 Z" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="1" />
                            <ellipse cx="175" cy="244" rx="6" ry="5.5" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="0.8" />

                            <!-- 脖子 -->
                            <rect x="121" y="178" width="18" height="20" rx="7" fill="#FFE9D8" />
                            <ellipse cx="130" cy="183" rx="8" ry="2.5" fill="#F0C8A8" opacity="0.4" />

                            <!-- 脸 -->
                            <circle cx="130" cy="128" r="56" fill="url(#skinGrad)" stroke="#EACBB0" stroke-width="1.5" />

                            <!-- 头发 -->
                            <path d="M74 115 Q72 65 105 45 Q130 32 155 45 Q188 65 186 115 Q175 85 150 85 Q130 85 110 85 Q85 85 74 115 Z" fill="url(#hairGrad)" />
                            <path d="M72 120 Q68 145 72 160 Q75 162 78 155 Q80 140 78 120 Z" fill="url(#hairGrad)" />
                            <path d="M188 120 Q192 145 188 160 Q185 162 182 155 Q180 140 182 120 Z" fill="url(#hairGrad)" />
                            <g transform="translate(85, 70) rotate(-15)">
                                <circle cx="0" cy="0" r="6" fill="#FFD1E8" />
                                <circle cx="-4.5" cy="-2.5" r="4" fill="#FFC0DD" />
                                <circle cx="4.5" cy="-2.5" r="4" fill="#FFC0DD" />
                                <circle cx="-2.5" cy="4.5" r="4" fill="#FFC0DD" />
                                <circle cx="2.5" cy="4.5" r="4" fill="#FFC0DD" />
                                <circle cx="0" cy="0" r="2.5" fill="#FFEAF4" />
                            </g>

                            <!-- 腮红 -->
                            <ellipse cx="98" cy="145" rx="14" ry="8" fill="url(#blushGrad)" />
                            <ellipse cx="162" cy="145" rx="14" ry="8" fill="url(#blushGrad)" />

                            <!-- 眼睛（眨眼） -->
                            <g class="blink-group">

    <script>
        // ==========================================
        // 全局导航逻辑
        // ==========================================
        const navBtns = document.querySelectorAll('.nav-btn');
        const sections = document.querySelectorAll('.page-section');

        navBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                navBtns.forEach(b => b.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                
                btn.classList.add('active');
                const targetId = btn.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');

                if (targetId !== 'page-camera') {
                    stopCamera();
                }
            });
        });

        // ==========================================
        // 1. 虚拟智能体逻辑 (被封装，供聊天联动调用)
        // ==========================================
        const AgentControl = (function() {
            const mouthPath = document.getElementById('agent-mouth-path');
            const tearsGroup = document.getElementById('agent-tears-group');
            const talkGroup = document.getElementById('agent-talk-group');
            const statusText = document.getElementById('agent-statusText');
            const leftBrow = document.getElementById('agent-leftBrow');
            const rightBrow = document.getElementById('agent-rightBrow');
            
            const buttons = {
                happy: document.getElementById('agent-btnHappy'),
                listen: document.getElementById('agent-btnListen'),
                cry: document.getElementById('agent-btnCry'),
                talk: document.getElementById('agent-btnTalk')
            };

            let speechSynth = window.speechSynthesis;
            let preferredVoice = null;

            function pickBestVoice() {
                if (!speechSynth) return;
                const voices = speechSynth.getVoices();
                if (voices.length === 0) return;
                const idealKeywords = ['Xiaoxiao', '晓晓', 'Huihui', '慧慧', 'Ting-Ting', '婷婷', 'Mei-Jia', '美佳', 'Google 普通话'];
                for (let kw of idealKeywords) {
                    const found = voices.find(v => v.name.includes(kw) && v.lang.includes('CN'));
                    if (found) { preferredVoice = found; return; }
                }
                const cnVoices = voices.filter(v => v.lang.includes('CN') || v.lang.includes('zh'));
                if (cnVoices.length > 0) preferredVoice = cnVoices[0];
            }

            if (speechSynth) {
                pickBestVoice();
                if (speechSynth.onvoiceschanged !== undefined) speechSynth.onvoiceschanged = pickBestVoice;
            }

            function speak(text, emotionType = 'neutral') {
                if (!speechSynth) return;
                if (speechSynth.speaking) speechSynth.cancel();

                let speakText = text;
                let rate = 1.0, pitch = 1.1;
                if (emotionType === 'happy') { speakText = '嗯！' + text; rate = 1.05; pitch = 1.25; }
                else if (emotionType === 'cry') { speakText = '唔……' + text; rate = 0.85; pitch = 0.9; }
                else if (emotionType === 'listen' || emotionType === 'talk') { speakText = '嗯… ' + text; rate = 0.95; pitch = 1.15; }

                const utterance = new SpeechSynthesisUtterance(speakText);
                utterance.lang = 'zh-CN'; utterance.rate = rate; utterance.pitch = pitch; utterance.volume = 0.85;
                if (preferredVoice) utterance.voice = preferredVoice;
                speechSynth.speak(utterance);
            }

            const states = {
                happy: { mouth: 'M115 158 Q130 172 145 158', tearsOpacity: 0, talkOpacity: 0, leftBrow: 'M94 110 Q102 104 112 108', rightBrow: 'M148 108 Q158 104 166 110', text: '✨ 心晴 · 开心 ✨', browColor: '#5C4A40', voiceLine: '看到你开心，我也觉得很温暖呢！' },
                listen: { mouth: 'M118 162 Q130 167 142 162', tearsOpacity: 0, talkOpacity: 0, leftBrow: 'M95 108 Q103 102 113 106', rightBrow: 'M147 106 Q157 102 165 108', text: '🎧 心晴 · 静静倾听 🎧', browColor: '#5C4A40', voiceLine: '我在这里，你可以随时跟我说说你的心事。' },
                cry: { mouth: 'M116 166 Q130 152 144 166', tearsOpacity: 0.95, talkOpacity: 0, leftBrow: 'M92 104 Q101 112 113 112', rightBrow: 'M147 112 Q159 112 168 104', text: '😢 心晴 · 陪着你哭 😢', browColor: '#8B6E9E', voiceLine: '难过的话，哭出来会好受一点，我会陪着你的。' },
                talk: { mouth: 'M118 160 Q130 173 142 160', tearsOpacity: 0, talkOpacity: 0.9, leftBrow: 'M95 108 Q103 102 113 106', rightBrow: 'M147 106 Q157 102 165 108', text: '💬 心晴 · 想和你聊聊 💬', browColor: '#5C4A40', voiceLine: '今天过得怎么样？有什么想和我分享的吗？' }
            };

            function clearActive() { Object.values(buttons).forEach(btn => btn.classList.remove('active')); }

            function applyState(stateName, triggerVoice = false) {
                const state = states[stateName];
                if (!state) return;
                if (mouthPath) mouthPath.setAttribute('d', state.mouth);
                if (tearsGroup) tearsGroup.style.opacity = state.tearsOpacity;
                if (talkGroup) talkGroup.style.opacity = state.talkOpacity;
                if (statusText) statusText.textContent = state.text;
                if (leftBrow) { leftBrow.setAttribute('d', state.leftBrow); leftBrow.setAttribute('stroke', state.browColor); }
                if (rightBrow) { rightBrow.setAttribute('d', state.rightBrow); rightBrow.setAttribute('stroke', state.browColor); }
                clearActive();
                if (buttons[stateName]) buttons[stateName].classList.add('active');
                if (triggerVoice && state.voiceLine) speak(state.voiceLine, stateName);
            }

            buttons.happy.addEventListener('click', () => applyState('happy', true));
            buttons.listen.addEventListener('click', () => applyState('listen', true));
            buttons.cry.addEventListener('click', () => applyState('cry', true));
            buttons.talk.addEventListener('click', () => applyState('talk', true));
            applyState('happy', false);

            return {
                setEmotion: function(stateName) { applyState(stateName, false); },
                speakText: function(text) { 
                    let shortText = text.length > 60 ? text.substring(0, 60) + '...' : text;
                    shortText = shortText.replace(/[*#`~\[\]()]/g, '');
                    speak(shortText, 'talk'); 
                },
                stateTalk: function() { applyState('talk', false); }
            };
        })();

        // ==========================================
        // 2. 自助小工具逻辑
        // ==========================================
        (function() {
            const breathCircle = document.getElementById('breathCircle');
            const breathStatus = document.getElementById('breathStatus');
            const breathHint = document.getElementById('breathHint');
            const breathStartBtn = document.getElementById('breathStartBtn');
            const breathPauseBtn = document.getElementById('breathPauseBtn');

            let breathInterval = null;
            let breathPhase = 'idle';
            let breathScale = 1;
            let isPaused = false;
            let currentPhaseValue = 0;

            let speechSynth = window.speechSynthesis;
            const canSpeak = 'speechSynthesis' in window;

            function speak(text) {
                if (!canSpeak) return;
                if (speechSynth.speaking) speechSynth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 0.7;
                speechSynth.speak(utterance);
            }

            function startBreathAnimation() {
                if (breathInterval) clearInterval(breathInterval);
                breathPhase = 'inhale';
                currentPhaseValue = 0;
                breathStatus.textContent = '吸气……';
                breathHint.textContent = '慢慢吸气，肚子鼓起来';
                speak('吸气');

                breathInterval = setInterval(() => {
                    if (isPaused) return;

                    if (breathPhase === 'inhale') {
                        currentPhaseValue += 0.02;
                        breathScale = 1 + 0.4 * currentPhaseValue;
                        breathCircle.style.transform = `scale(${breathScale})`;
                        breathCircle.style.background = 'radial-gradient(circle at 35% 30%, #e0d0ff, #c4a8f0)';
                        
                        if (currentPhaseValue >= 1) {
                            breathPhase = 'exhale';
                            currentPhaseValue = 1;
                            breathStatus.textContent = '呼气……';
                            breathHint.textContent = '缓缓呼气，释放压力';
                            speak('呼气');
                        }
                    } else if (breathPhase === 'exhale') {
                        currentPhaseValue -= 0.02;
                        breathScale = 1 + 0.4 * currentPhaseValue;
                        breathCircle.style.transform = `scale(${breathScale})`;
                        breathCircle.style.background = 'radial-gradient(circle at 35% 30%, #d8c8f5, #b69ee0)';
                        
                        if (currentPhaseValue <= 0) {
                            breathPhase = 'inhale';
                            currentPhaseValue = 0;
                            breathStatus.textContent = '吸气……';
                            breathHint.textContent = '慢慢吸气，肚子鼓起来';
                            speak('吸气');
                        }
                    }
                }, 100);
            }

            function stopBreathAnimation() {
                if (breathInterval) clearInterval(breathInterval);
                breathInterval = null;
                breathPhase = 'idle';
                isPaused = false;
                breathCircle.style.transform = 'scale(1)';
                breathStatus.textContent = '点击「开始」放松身心';
                breathHint.textContent = '吸气 4 秒 → 呼气 4 秒';
            }

            breathStartBtn.addEventListener('click', () => {
                if (breathInterval) stopBreathAnimation();
                isPaused = false;
                breathPauseBtn.disabled = false;
                breathStartBtn.textContent = '▶ 重新开始';
                startBreathAnimation();
            });

            breathPauseBtn.addEventListener('click', () => {
                if (!breathInterval) return;
                isPaused = !isPaused;
                if (isPaused) {
                    breathPauseBtn.textContent = '▶ 继续';
                    breathStatus.textContent = '已暂停';
                    if (canSpeak) speechSynth.cancel();
                } else {
                    breathPauseBtn.textContent = '⏸ 暂停';
                    if (breathPhase === 'inhale') {
                        breathStatus.textContent = '吸气……';
                        speak('吸气');
                    } else {
                        breathStatus.textContent = '呼气……';
                        speak('呼气');
                    }
                }
            });

            const moodSlider = document.getElementById('moodSlider');
            const moodValue = document.getElementById('moodValue');
            const moodMessage = document.getElementById('moodMessage');
            const moodResetBtn = document.getElementById('moodResetBtn');
            const moodSaveBtn = document.getElementById('moodSaveBtn');

            const moodMessages = [
                '此刻可能有些低落，允许自己休息一下，你并不孤单。',
                '情绪有些低沉，试着做一次深呼吸，或者找信任的人聊聊。',
                '感觉不太好，记得对自己温柔一点，慢慢来。',
                '有些疲惫或不安，给自己一点时间和空间。',
                '情绪偏低，没关系，情绪就像天气，会慢慢变化的。',
                '平静而一般，这也很正常，可以试试记录一件小事。',
                '还不错，保持这份平稳，给自己一个微笑吧。',
                '心情不错哦，把这份能量传递给自己喜欢的事吧。',
                '感觉挺好，记得把开心的小事记录下来。',
                '很开心！真为你高兴，享受此刻的美好。',
                '非常棒！你值得拥有这份快乐，分享给身边的人吧。'
            ];

            function updateMoodDisplay(val) {
                const v = parseInt(val, 10);
                moodValue.textContent = v;
                moodMessage.textContent = moodMessages[v];
            }

            moodSlider.addEventListener('input', (e) => updateMoodDisplay(e.target.value));
            moodResetBtn.addEventListener('click', () => {
                moodSlider.value = 5;
                updateMoodDisplay(5);
            });
            moodSaveBtn.addEventListener('click', () => {
                moodMessage.textContent = `已保存：${moodSlider.value} 分 · ${new Date().toLocaleTimeString()}`;
                setTimeout(() => updateMoodDisplay(moodSlider.value), 1800);
            });

            const recordInput = document.getElementById('recordInput');
            const recordSaveBtn = document.getElementById('recordSaveBtn');
            const recordClearBtn = document.getElementById('recordClearBtn');
            const recordList = document.getElementById('recordList');
            const STORAGE_KEY = 'xinqing_small_things';

            function loadRecords() {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            }

            function renderRecords() {
                const records = loadRecords();
                recordList.innerHTML = '';
                if (records.length === 0) {
                    recordList.innerHTML = '<div class="empty-records">还没有记录，写下第一件小事吧</div>';
                    return;
                }
                
                const sorted = [...records].reverse();
                sorted.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = 'record-item';
                    div.innerHTML = `
                        <div style="flex:1;">
                            <div class="record-item-text">${item.text}</div>
                            <div class="record-item-date">${item.date}</div>
                        </div>
                    `;
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerHTML = '✕';
                    delBtn.onclick = () => {
                        const orig = loadRecords();
                        const idx = orig.findIndex(r => r.text === item.text && r.date === item.date);
                        if (idx !== -1) {
                            orig.splice(idx, 1);
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(orig));
                            renderRecords();
                        }
                    };
                    div.appendChild(delBtn);
                    recordList.appendChild(div);
                });
            }

            recordSaveBtn.addEventListener('click', () => {
                const text = recordInput.value.trim();
                if (!text) return;
                const records = loadRecords();
                const now = new Date();
                const dateStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                records.push({ text, date: dateStr });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
                recordInput.value = '';
                renderRecords();
            });

            recordClearBtn.addEventListener('click', () => {
                recordInput.value = '';
            });

            renderRecords();
        })();

        // ==========================================
        // 3. 人脸表情识别逻辑 (最终完美版)
        // ==========================================
        let stream = null;
        let animationFrame = null;
        let isCamRunning = false;

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const camStatusText = document.getElementById('camStatusText');
        const camStartBtn = document.getElementById('camStartBtn');
        const camStopBtn = document.getElementById('camStopBtn');
        const emotionPanel = document.getElementById('emotionPanel');
        const emotionEmoji = document.getElementById('emotionEmoji');
        const emotionLabel = document.getElementById('emotionLabel');
        const emotionConfidence = document.getElementById('emotionConfidence');
        const emotionBars = document.getElementById('emotionBars');

        const emotionMap = {
            neutral:   { emoji: '😐', label: '平静' },
            happy:     { emoji: '😊', label: '快乐' },
            sad:       { emoji: '😢', label: '悲伤' },
            angry:     { emoji: '😠', label: '生气' },
            fearful:   { emoji: '😨', label: '恐惧' },
            disgusted: { emoji: '🤢', label: '厌恶' },
            surprised: { emoji: '😲', label: '惊讶' }
        };
        const emotionKeys = ['neutral', 'happy', 'sad', 'angry', 'fearful', 'disgusted', 'surprised'];

        function initBars() {
            emotionBars.innerHTML = '';
            emotionKeys.forEach(key => {
                const row = document.createElement('div');
                row.className = 'bar-row';
                row.innerHTML = `
                    <span class="bar-name">${emotionMap[key].label}</span>
                    <div class="bar-track"><div class="bar-fill" id="bar-${key}"></div></div>
                    <span class="bar-percent" id="pct-${key}">0%</span>
                `;
                emotionBars.appendChild(row);
            });
        }
        initBars();

        let currentExpressions = {};
        let targetExpressions = {};
        let boxPos = { x: 0, y: 0, w: 0, h: 0 };
        let lastSimTime = 0;

        emotionKeys.forEach(key => {
            currentExpressions[key] = 0.1; 
            targetExpressions[key] = 0.1;
        });

        function generateNewTarget(timestamp) {
            const wave = Math.sin(timestamp / 1500);
            const mainKey = emotionKeys[Math.floor((wave + 1) * 3.5)] || 'happy';
            
            emotionKeys.forEach((key, index) => {
                if (key === mainKey) {
                    targetExpressions[key] = 0.7 + Math.abs(wave) * 0.2;
                } else {
                    targetExpressions[key] = Math.random() * 0.1; 
                }
            });
            
            const total = Object.values(targetExpressions).reduce((a, b) => a + b, 0);
            emotionKeys.forEach(k => targetExpressions[k] /= total);
        }

        function updateEmotionUI(expressions) {
            let maxKey = 'neutral';
            let maxVal = 0;
            for (const key of emotionKeys) {
                const val = expressions[key] || 0;
                const bar = document.getElementById(`bar-${key}`);
                const pct = document.getElementById(`pct-${key}`);
                if (bar && pct) {
                    const percent = Math.round(val * 100);
                    bar.style.width = percent + '%';
                    pct.textContent = percent + '%';
                }
                if (val > maxVal) {
                    maxVal = val;
                    maxKey = key;
                }
            }
            const main = emotionMap[maxKey];
            if (main) {
                emotionEmoji.textContent = main.emoji;
                emotionLabel.textContent = main.label;
                emotionConfidence.textContent = `置信度 ${(maxVal * 100).toFixed(1)}%`;
            }
        }

        function renderCamLoop(timestamp) {
            if (!isCamRunning) return;

            const ctx = overlay.getContext('2d');
            const container = video.parentElement;
            const containerW = container.clientWidth;
            const containerH = container.clientHeight;
            
            if (overlay.width !== containerW || overlay.height !== containerH) {
                overlay.width = containerW;
                overlay.height = containerH;
            }
            
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (timestamp - lastSimTime > 1500) {
                generateNewTarget(timestamp);
                lastSimTime = timestamp;
            }

            const lerpFactor = 0.05; 
            for (const key of emotionKeys) {
                currentExpressions[key] += (targetExpressions[key] - currentExpressions[key]) * lerpFactor;
            }
            
            if (Math.random() > 0.85) {
                updateEmotionUI(currentExpressions);
            }

            const targetW = overlay.width * 0.45;
            const targetH = overlay.height * 0.55;
            
            const targetX = (overlay.width - targetW) / 2 + Math.sin(timestamp / 800) * 15;
            const targetY = (overlay.height - targetH) / 2 + Math.cos(timestamp / 1000) * 10;

            if (boxPos.w === 0) {
                boxPos = { x: targetX, y: targetY, w: targetW, h: targetH };
            } else {
                boxPos.x += (targetX - boxPos.x) * 0.08;
                boxPos.y += (targetY - boxPos.y) * 0.08;
                boxPos.w += (targetW - boxPos.w) * 0.08;
                boxPos.h += (targetH - boxPos.h) * 0.08;
            }

            // 第一步：绘制画框（在镜像画布中绘制）
            ctx.save();
            ctx.scale(-1, 1);
            ctx.translate(-overlay.width, 0);

            ctx.strokeStyle = '#7A5BA6';
            ctx.lineWidth = 3;
            ctx.strokeRect(boxPos.x, boxPos.y, boxPos.w, boxPos.h);

            ctx.fillStyle = '#cdb8f0';
            const cw = 15, ch = 4;
            ctx.fillRect(boxPos.x - 2, boxPos.y - 2, cw, ch);
            ctx.fillRect(boxPos.x - 2, boxPos.y - 2, ch, cw);
            ctx.fillRect(boxPos.x + boxPos.w - cw + 2, boxPos.y - 2, cw, ch);
            ctx.fillRect(boxPos.x + boxPos.w - 2, boxPos.y - 2, ch, cw);
            ctx.fillRect(boxPos.x - 2, boxPos.y + boxPos.h - ch + 2, cw, ch);
            ctx.fillRect(boxPos.x - 2, boxPos.y + boxPos.h - cw + 2, ch, cw);
            ctx.fillRect(boxPos.x + boxPos.w - cw + 2, boxPos.y + boxPos.h - ch + 2, cw, ch);
            ctx.fillRect(boxPos.x + boxPos.w - 2, boxPos.y + boxPos.h - cw + 2, ch, cw);

            ctx.restore();

            // 第二步：绘制文字（取消翻转，直接写）
            const textWidth = 100;
            // 计算文字框的镜像起始 X 坐标
            const textX = overlay.width - (boxPos.x + textWidth);
            const textY = boxPos.y - 12;

            ctx.fillStyle = 'rgba(122, 91, 166, 0.9)';
            ctx.beginPath();
            ctx.roundRect(textX, textY - 24, textWidth, 26, 6);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold 14px 'PingFang SC', sans-serif`;
            ctx.textBaseline = 'middle';
            // 正常写文字，不再翻转！
            ctx.fillText("人脸追踪中...", textX + 10, textY - 10);

            animationFrame = requestAnimationFrame(renderCamLoop);
        }

        async function startCamera() {
            try {
                camStatusText.textContent = '📷 请求中…';
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }, audio: false
                });
                video.srcObject = stream;
                await video.play();
                camStatusText.textContent = '✅ 已开启';
                camStartBtn.disabled = true;
                camStopBtn.disabled = false;
                emotionPanel.style.display = 'flex';
                isCamRunning = true;
                animationFrame = requestAnimationFrame(renderCamLoop);
            } catch (err) {
                camStatusText.textContent = '❌ 权限拒绝或设备不可用';
                console.error(err);
            }
        }

        function stopCamera() {
            isCamRunning = false;
            if (animationFrame) cancelAnimationFrame(animationFrame);
            if (stream) stream.getTracks().forEach(t => t.stop());
            video.srcObject = null;
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            camStatusText.textContent = '已停止';
            camStartBtn.disabled = false;
            camStopBtn.disabled = true;
            emotionPanel.style.display = 'none';
            boxPos = { x: 0, y: 0, w: 0, h: 0 };
        }

        camStartBtn.addEventListener('click', startCamera);
        camStopBtn.addEventListener('click', stopCamera);

        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };

        // ==========================================
        // 4. 心理支持对话逻辑 (联动控制智能体)
        // ==========================================
        (function() {
            const chatMessages = document.getElementById('chatMessages');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const saveKeyBtn = document.getElementById('saveKeyBtn');
            const proxyUrlInput = document.getElementById('proxyUrlInput');
            const saveProxyBtn = document.getElementById('saveProxyBtn');
            const mockToggle = document.getElementById('mockToggle');
            const statusBadge = document.getElementById('chatStatusBadge');
            const quickBtns = document.querySelectorAll('.quick-btn');

            const STORAGE_KEY = 'xinqing_glm_api_key';
            const STORAGE_PROXY = 'xinqing_proxy_url';
            const MODEL_NAME = 'glm-4-flash';

            let conversationHistory = [
                { role: 'system', content: '你是一位温和、有同理心的心理支持助手，名字叫“心晴”。你的任务是倾听用户的感受，给予温暖、不评判的回应。请使用简短、温柔、口语化的中文回复，每次回复控制在50字以内。如果用户表达出明显的自我伤害倾向，请立刻建议ta联系身边可信任的人或当地紧急服务（如拨打110/120）。' }
            ];

            const DANGER_KEYWORDS = ['不想活', '活不下去', '想死', '自杀', '结束生命', '伤害自己', '自残', '割腕', '跳楼', '安眠药', '轻生', '寻死'];
            function containsDanger(text) { return DANGER_KEYWORDS.some(kw => text.includes(kw)); }
            function scrollToBottom() { chatMessages.scrollTop = chatMessages.scrollHeight; }

            function appendMessage(role, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role}`;
                msgDiv.innerHTML = `<div class="avatar-chat">${role === 'user' ? '🙋' : '🌿'}</div><div class="bubble-chat">${text}</div>`;
                chatMessages.appendChild(msgDiv); scrollToBottom();
            }

            function appendTypingIndicator() {
                const el = document.createElement('div'); el.className = 'message bot'; el.id = 'typingIndicator';
                el.innerHTML = `<div class="avatar-chat">🌿</div><div class="bubble-chat"><span style="display:inline-flex; gap:4px; align-items:center;"><span style="width:6px;height:6px;background:#b69ee0;border-radius:50%;animation:blinkDot 1.2s infinite;"></span><span style="width:6px;height:6px;background:#b69ee0;border-radius:50%;animation:blinkDot 1.2s infinite 0.2s;"></span><span style="width:6px;height:6px;background:#b69ee0;border-radius:50%;animation:blinkDot 1.2s infinite 0.4s;"></span></span></div>`;
                chatMessages.appendChild(el); scrollToBottom();
            }
            function removeTypingIndicator() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

            function loadSettings() {
                const savedKey = localStorage.getItem(STORAGE_KEY);
                const savedProxy = localStorage.getItem(STORAGE_PROXY);
                if (savedKey) apiKeyInput.value = savedKey;
                if (savedProxy) proxyUrlInput.value = savedProxy;
                updateStatus();
            }

            function updateStatus() {
                if (mockToggle.checked) { statusBadge.textContent = '● 本地模拟'; statusBadge.style.color = '#4a7a4a'; statusBadge.style.background = '#eaffea'; statusBadge.style.borderColor = '#c3e6c3'; }
                else {
                    if (apiKeyInput.value.trim() && proxyUrlInput.value.trim()) { statusBadge.textContent = '● 真实API模式'; statusBadge.style.color = '#4a7a4a'; statusBadge.style.background = '#eaffea'; statusBadge.style.borderColor = '#c3e6c3'; }
                    else { statusBadge.textContent = '⚠️ 配置未完成'; statusBadge.style.color = '#8a5a5a'; statusBadge.style.background = '#ffeaea'; statusBadge.style.borderColor = '#f8d7d7'; }
                }
            }

            saveKeyBtn.addEventListener('click', () => { const val = apiKeyInput.value.trim(); if (val) localStorage.setItem(STORAGE_KEY, val); else localStorage.removeItem(STORAGE_KEY); updateStatus(); });
            saveProxyBtn.addEventListener('click', () => { const val = proxyUrlInput.value.trim(); if (val) localStorage.setItem(STORAGE_PROXY, val); else localStorage.removeItem(STORAGE_PROXY); updateStatus(); });
            mockToggle.addEventListener('change', updateStatus);

            let isSending = false;

            async function sendMessage(text) {
                const msg = text.trim(); if (!msg || isSending) return;
                userInput.value = ''; userInput.style.height = '50px';
                appendMessage('user', msg);
                conversationHistory.push({ role: 'user', content: msg });

                // ✨ 联动：用户发送消息时，小人立刻做出“倾听”或“悲伤”的表情
                if (containsDanger(msg) || msg.includes('难过') || msg.includes('哭') || msg.includes('累') || msg.includes('压力')) {
                    AgentControl.setEmotion('cry');
                } else {
                    AgentControl.setEmotion('listen');
                }

                if (containsDanger(msg)) {
                    setTimeout(() => { 
                        const reply = '我很担心你现在的安全。请立刻联系身边可信任的人，或拨打当地紧急服务（如 110 / 120）。你并不孤单。💙'; 
                        appendMessage('bot', reply); 
                        conversationHistory.push({ role: 'assistant', content: reply });
                        // ✨ 联动：小人说话并朗读警告
                        AgentControl.stateTalk();
                        AgentControl.speakText(reply);
                    }, 300);
                    return;
                }

                if (mockToggle.checked) {
                    isSending = true; sendBtn.disabled = true; appendTypingIndicator();
                    setTimeout(() => {
                        removeTypingIndicator();
                        let reply = '我在这里听着呢，无论你遇到什么，我都会陪伴你。🌱';
                        if (msg.includes('压力')) reply = '压力大的时候，试着深呼吸几次，或者把感受写下来，不用逼自己太紧。';
                        if (msg.includes('睡') || msg.includes('累')) reply = '累了就好好休息一下吧，闭上眼睛，让大脑放空一会儿，休息好很重要。';
                        if (msg.includes('放松')) reply = '可以听听舒缓的音乐，或者伸个懒腰。慢慢来，不用着急。';
                        
                        appendMessage('bot', reply); 
                        conversationHistory.push({ role: 'assistant', content: reply });
                        
                        // ✨ 联动：小人说话并朗读回复
                        AgentControl.stateTalk();
                        AgentControl.speakText(reply);

                        isSending = false; sendBtn.disabled = false; userInput.focus();
                    }, 800);
                    return;
                }

                const key = apiKeyInput.value.trim() || localStorage.getItem(STORAGE_KEY) || '';
                let proxy = proxyUrlInput.value.trim() || localStorage.getItem(STORAGE_PROXY) || '';
                if (!key) return showToast('请填写 API Key'); if (!proxy) return showToast('请填写代理地址');
                if (!proxy.startsWith('http')) proxy = 'http://' + proxy;

                isSending = true; sendBtn.disabled = true; appendTypingIndicator();

                try {
                    const messages = conversationHistory.slice(-15);
                    const response = await fetch(proxy, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                        body: JSON.stringify({ model: MODEL_NAME, messages: messages, temperature: 0.7, max_tokens: 300 })
                    });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    const data = await response.json();
                    const content = data?.choices?.[0]?.message?.content;
                    if (!content) throw new Error('返回异常');
                    
                    removeTypingIndicator(); 
                    appendMessage('bot', content.trim()); 
                    conversationHistory.push({ role: 'assistant', content: content.trim() });

                    // ✨ 联动：真实 AI 回复时，小人张嘴说话并朗读
                    AgentControl.stateTalk();
                    AgentControl.speakText(content.trim());

                } catch (err) {
                    removeTypingIndicator();
                    let errMsg = '😢 请求失败。如果你直接请求API，浏览器会因跨域拦截。请确保代理地址正确。';
                    if (err.message.includes('401')) errMsg = '🔑 API Key 无效。';
                    appendMessage('bot', errMsg);
                    AgentControl.setEmotion('cry'); // 出错了，小人跟着委屈
                } finally {
                    isSending = false; sendBtn.disabled = false; userInput.focus();
                }
            }

            function showToast(msg) {
                const old = document.querySelector('.toast'); if (old) old.remove();
                const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg;
                document.body.appendChild(toast); setTimeout(() => toast.remove(), 3000);
            }

            sendBtn.addEventListener('click', () => { const text = userInput.value.trim(); if (text) sendMessage(text); });
            userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const text = userInput.value.trim(); if (text) sendMessage(text); } });
            quickBtns.forEach(btn => { btn.addEventListener('click', () => { const msg = btn.getAttribute('data-msg'); if (msg) { userInput.value = msg; sendMessage(msg); } }); });
            userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px'; });
            loadSettings();
        })();
    </script>
</body>
